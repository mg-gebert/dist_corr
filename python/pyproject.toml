[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "dist-corr"
version = "0.1.1"
description = "Python bindings for the dist_corr Rust library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[tool.maturin]
python-source = "."
module-name = "dist_corr._rust"

[tool.poetry]
name = "dist-corr"
version = "0.1.1"
description = "Python bindings for the dist_corr Rust library"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.26"

[tool.poetry.group.dev.dependencies]
maturin = "^1.7"
pytest = "^9.0.2"
